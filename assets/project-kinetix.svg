<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191715" />
      <stop offset="50%" stop-color="#121113" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>
    <radialGradient id="kinGlow" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFD400" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#kinBg)" />
  <rect width="800" height="500" rx="16" fill="url(#kinGlow)" />

  <!-- Diagonal dynamic sports movement lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1.5">
    <line x1="0" y1="500" x2="500" y2="0" />
    <line x1="150" y1="500" x2="650" y2="0" />
    <line x1="300" y1="500" x2="800" y2="0" />
    <line x1="450" y1="500" x2="950" y2="0" />
  </g>

  <!-- Left: Viral Reels Mobile Device Mockup (Phone Frame) -->
  <g transform="translate(130, 45)">
    <!-- Smartphone Chassis -->
    <rect width="210" height="410" rx="34" fill="#0A0A0B" stroke="#2D2D35" stroke-width="3" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="75" y="12" width="60" height="14" rx="7" fill="#131316" />

    <!-- Phone Screen with Reels Content Simulation -->
    <rect x="8" y="8" width="194" height="394" rx="28" fill="#181820" />
    
    <!-- Reel Video Visual Simulation (Running Athlete in Dark Aesthetic) -->
    <ellipse cx="105" cy="200" rx="70" ry="120" fill="#202028" />
    <path d="M75 140 C85 110 120 110 130 140 C140 180 120 240 105 270 C90 240 70 180 75 140 Z" fill="#2E2E38" />
    <!-- Yellow Neon Runner Silhouette Accent -->
    <path d="M100 130 L115 145 L105 180 L130 220 L120 260" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Instagram/TikTok Overlay Icons on Right -->
    <g transform="translate(162, 190)">
      <!-- Heart -->
      <circle cx="16" cy="16" r="14" fill="#0A0A0B" fill-opacity="0.6" />
      <path d="M11 14 C11 11 14 10 16 13 C18 10 21 11 21 14 C21 18 16 21 16 21 C16 21 11 18 11 14 Z" fill="#FFD400" />
      <text x="7" y="38" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="9" font-weight="600">842K</text>

      <!-- Comments -->
      <circle cx="16" cy="56" r="14" fill="#0A0A0B" fill-opacity="0.6" />
      <circle cx="16" cy="55" r="6" fill="#F5F3EE" />
      <text x="9" y="78" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="9" font-weight="600">24K</text>

      <!-- Share -->
      <circle cx="16" cy="96" r="14" fill="#0A0A0B" fill-opacity="0.6" />
      <path d="M13 95 L19 92 L13 89 Z" fill="#F5F3EE" />
      <text x="8" y="118" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="9" font-weight="600">110K</text>
    </g>

    <!-- Bottom Audio & Caption info -->
    <rect x="20" y="325" width="130" height="20" rx="4" fill="#0A0A0B" fill-opacity="0.7" />
    <text x="26" y="338" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="10" font-weight="700">@kinetix.athletes</text>
    <text x="20" y="360" fill="#EDEAE4" font-family="'Inter', sans-serif" font-size="9">Explosive power conditioning...</text>
    <!-- Music track pill -->
    <rect x="20" y="370" width="105" height="16" rx="8" fill="#0A0A0B" fill-opacity="0.8" />
    <text x="30" y="381" fill="#FFD400" font-family="'Inter', sans-serif" font-size="8">♫ Original Sound - Trending</text>
  </g>

  <!-- Right: Big Viral Metrics Panel -->
  <g transform="translate(390, 80)">
    <rect width="320" height="340" rx="16" fill="#131316" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

    <g transform="translate(30, 36)">
      <rect width="130" height="26" rx="13" fill="#1B1B20" stroke="rgba(255,255,255,0.1)" />
      <text x="14" y="17" fill="#FFD400" font-family="'Inter', sans-serif" font-size="10" font-weight="700">VIRAL REELS SUITE</text>

      <text x="0" y="70" fill="#6B6B73" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">AGGREGATE REACH</text>
      <text x="0" y="118" fill="#F5F3EE" font-family="'Syne', sans-serif" font-size="44" font-weight="800">12.4M</text>
      <text x="145" y="112" fill="#3DDC97" font-family="'Inter', sans-serif" font-size="14" font-weight="700">▲ Organic Views</text>

      <!-- Follower Growth Block -->
      <rect y="145" width="260" height="60" rx="10" fill="#1B1B20" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="170" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11">Net New Community</text>
      <text x="16" y="193" fill="#FFD400" font-family="'Inter', sans-serif" font-size="16" font-weight="700">+88.5K Followers</text>
      <text x="160" y="193" fill="#3DDC97" font-family="'Inter', sans-serif" font-size="12" font-weight="600">in 60 Days</text>

      <!-- Multi-Platform Icons -->
      <g transform="translate(0, 225)">
        <rect width="80" height="32" rx="6" fill="#1B1B20" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="20" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Instagram</text>

        <rect x="90" width="80" height="32" rx="6" fill="#1B1B20" stroke="rgba(255,255,255,0.06)" />
        <text x="108" y="20" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="600">TikTok</text>

        <rect x="180" width="80" height="32" rx="6" fill="#1B1B20" stroke="rgba(255,255,255,0.06)" />
        <text x="190" y="20" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="600">YT Shorts</text>
      </g>
    </g>
  </g>
</svg>
