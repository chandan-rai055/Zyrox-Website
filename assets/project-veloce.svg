<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="velBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>
    <linearGradient id="velBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D2A18" />
      <stop offset="100%" stop-color="#FFD400" />
    </linearGradient>
    <radialGradient id="velGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFD400" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#velBg)" />
  <rect width="800" height="500" rx="16" fill="url(#velGlow)" />

  <!-- Code & Tech Grid Background lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- High-Tech Browser / SEO Dashboard Window -->
  <g transform="translate(80, 50)">
    <!-- Browser Frame -->
    <rect width="640" height="400" rx="14" fill="#131316" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
    
    <!-- Window Header -->
    <rect width="640" height="44" rx="14" fill="#1B1B20" />
    <circle cx="28" cy="22" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="22" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10B981" opacity="0.8" />

    <!-- Search / URL bar -->
    <rect x="100" y="10" width="360" height="24" rx="6" fill="#131316" stroke="rgba(255,255,255,0.06)" />
    <text x="120" y="26" fill="#A1A1AA" font-family="'Inter', monospace" font-size="11">https://analytics.google.com/search-console/organic-growth</text>

    <!-- Stat Pill -->
    <rect x="510" y="10" width="110" height="24" rx="12" fill="#0A0A0B" stroke="#FFD400" stroke-width="1" />
    <text x="525" y="26" fill="#FFD400" font-family="'Inter', sans-serif" font-size="10" font-weight="700">INDEXED: 100%</text>

    <!-- Main Content Grid -->
    <!-- Left Col: Metrics & Growth -->
    <g transform="translate(30, 70)">
      <text x="0" y="16" fill="#6B6B73" font-family="'Inter', sans-serif" font-size="11" font-weight="600">MONTHLY ORGANIC SEARCH VISITS</text>
      <text x="0" y="60" fill="#F5F3EE" font-family="'Syne', sans-serif" font-size="38" font-weight="800">+185,420</text>
      <text x="210" y="55" fill="#3DDC97" font-family="'Inter', sans-serif" font-size="14" font-weight="700">▲ +412% YoY</text>

      <!-- Bar Chart -->
      <g transform="translate(0, 95)">
        <rect x="0" y="120" width="30" height="40" rx="4" fill="#1B1B20" />
        <rect x="45" y="105" width="30" height="55" rx="4" fill="#1B1B20" />
        <rect x="90" y="85" width="30" height="75" rx="4" fill="#1B1B20" />
        <rect x="135" y="60" width="30" height="100" rx="4" fill="#2A2A35" />
        <rect x="180" y="40" width="30" height="120" rx="4" fill="#3E3A1C" />
        <rect x="225" y="15" width="30" height="145" rx="4" fill="#6B5900" />
        <rect x="270" y="0" width="30" height="160" rx="4" fill="url(#velBar)" stroke="#FFD400" stroke-width="1.5" />

        <text x="0" y="180" fill="#6B6B73" font-family="'Inter', sans-serif" font-size="10">Q1</text>
        <text x="90" y="180" fill="#6B6B73" font-family="'Inter', sans-serif" font-size="10">Q2</text>
        <text x="180" y="180" fill="#6B6B73" font-family="'Inter', sans-serif" font-size="10">Q3</text>
        <text x="270" y="180" fill="#FFD400" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Q4 (Now)</text>
      </g>
    </g>

    <!-- Right Col: Keyword Cluster Table -->
    <g transform="translate(360, 70)">
      <rect width="250" height="230" rx="10" fill="#1B1B20" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="30" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Top Ranking Keywords</text>

      <!-- Row 1 -->
      <line x1="20" y1="46" x2="230" y2="46" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="72" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11">cloud edge runtime</text>
      <rect x="175" y="58" width="55" height="20" rx="4" fill="#131316" stroke="#FFD400" stroke-width="1" />
      <text x="188" y="72" fill="#FFD400" font-family="'Inter', sans-serif" font-size="10" font-weight="700">#1 (USA)</text>

      <!-- Row 2 -->
      <line x1="20" y1="92" x2="230" y2="92" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="118" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11">serverless orchestration</text>
      <rect x="175" y="104" width="55" height="20" rx="4" fill="#131316" stroke="rgba(255,255,255,0.1)" />
      <text x="188" y="118" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="10" font-weight="600">#2 (Global)</text>

      <!-- Row 3 -->
      <line x1="20" y1="138" x2="230" y2="138" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="164" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11">distributed cache api</text>
      <rect x="175" y="150" width="55" height="20" rx="4" fill="#131316" stroke="rgba(255,255,255,0.1)" />
      <text x="188" y="164" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="10" font-weight="600">#1 (Global)</text>

      <!-- Core Web Vitals badge -->
      <rect x="20" y="190" width="210" height="28" rx="6" fill="#131316" />
      <circle cx="34" cy="204" r="5" fill="#3DDC97" />
      <text x="46" y="208" fill="#F5F3EE" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Core Web Vitals: 99/100 Score</text>
    </g>
  </g>
</svg>
